<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ec25b4"/>
      <stop offset="0.5" stop-color="#b03cf0"/>
      <stop offset="1" stop-color="#5b3df5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7736ed" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5b5bff"/>
      <stop offset="1" stop-color="#3da0ff"/>
    </linearGradient>
    <pattern id="dotsL" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="4.5" cy="4.5" r="1.3" fill="#ff4fa0"/>
    </pattern>
    <pattern id="dotsR" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="4.5" cy="4.5" r="1.3" fill="#5b8cff"/>
    </pattern>
    <radialGradient id="fadeL" cx="0.05" cy="0.85" r="0.55">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fadeR" cx="0.95" cy="0.8" r="0.5">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="maskL"><rect width="1600" height="1000" fill="url(#fadeL)"/></mask>
    <mask id="maskR"><rect width="1600" height="1000" fill="url(#fadeR)"/></mask>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Particle fields: pink and blue dot grids, faded towards the centre. -->
  <g mask="url(#maskL)" opacity="0.8">
    <rect width="1600" height="1000" fill="url(#dotsL)"/>
  </g>
  <g mask="url(#maskR)" opacity="0.75">
    <rect width="1600" height="1000" fill="url(#dotsR)"/>
  </g>

  <!-- Flowing wave lines. -->
  <g fill="none" stroke-linecap="round">
    <g stroke="url(#left)" filter="url(#glow)" opacity="0.8">
      <path d="M-50 640 C 200 520, 380 900, 700 1040" stroke-width="3"/>
      <path d="M-50 560 C 220 470, 360 860, 760 1040" stroke-width="2"/>
    </g>
    <g stroke="url(#left)" opacity="0.55" stroke-width="1">
      <path d="M-50 600 C 210 500, 370 880, 730 1040"/>
      <path d="M-50 680 C 190 560, 400 920, 660 1040"/>
      <path d="M-50 720 C 170 610, 420 940, 620 1040"/>
      <path d="M-50 520 C 230 440, 350 840, 800 1040"/>
    </g>
    <g stroke="url(#right)" filter="url(#glow)" opacity="0.8">
      <path d="M760 1040 C 1100 900, 1300 700, 1650 560" stroke-width="3"/>
      <path d="M840 1040 C 1150 930, 1320 760, 1650 640" stroke-width="2"/>
    </g>
    <g stroke="url(#right)" opacity="0.55" stroke-width="1">
      <path d="M800 1040 C 1120 915, 1310 730, 1650 600"/>
      <path d="M880 1040 C 1180 950, 1340 790, 1650 690"/>
      <path d="M720 1040 C 1080 880, 1290 670, 1650 520"/>
      <path d="M940 1040 C 1220 970, 1370 830, 1650 740"/>
    </g>
  </g>
</svg>
