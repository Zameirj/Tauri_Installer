<svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" width="1468" height="139" viewBox="0 0 1468 139">
  <!-- Banner background redrawn from wire-frames/Caseware Installer Software clean -purple.png
       (03_hero_banner_background.svg doesn't match it): lavender base, a violet glow along the
       bottom right that sweeps up to the top-right corner, and a pale sheen arc just above it. -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6e7fd"/>
      <stop offset=".45" stop-color="#e2e2fc"/>
      <stop offset=".62" stop-color="#dcdcfa"/>
      <stop offset=".8" stop-color="#e2ddfc"/>
      <stop offset="1" stop-color="#dad3fd"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="sheen" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <rect width="1468" height="139" fill="url(#base)"/>
  <g filter="url(#soft)">
    <path d="M680 160 Q980 150 1150 95 Q1250 55 1300 -10 L1420 -10 Q1350 75 1230 125 Q1120 160 980 160 Z" fill="#9c7ff4" opacity=".85"/>
    <ellipse cx="1310" cy="10" rx="100" ry="50" fill="#b5a3fb" opacity=".7"/>
  </g>
  <path d="M560 139 Q950 126 1125 60 Q1200 28 1240 0 L1272 0 Q1225 42 1145 80 Q980 136 560 139 Z" fill="#fdfcff" opacity=".9" filter="url(#sheen)"/>
</svg>
