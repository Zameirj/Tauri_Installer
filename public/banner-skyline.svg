    <rect x="150" y="78" width="22" height="42"/>
    <rect x="176" y="62" width="16" height="58"/>
    <rect x="196" y="84" width="26" height="36"/>
    <rect x="226" y="50" width="20" height="70"/>
    <rect x="250" y="70" width="28" height="50"/>
    <rect x="282" y="38" width="18" height="82"/>
    <rect x="304" y="58" width="24" height="62"/>
    <rect x="332" y="26" width="22" height="94"/>
    <rect x="358" y="54" width="30" height="66"/>
    <rect x="392" y="18" width="20" height="102"/>
    <rect x="416" y="46" width="26" height="74"/>
    <rect x="446" y="64" width="18" height="56"/>
    <rect x="468" y="34" width="22" height="86"/>
    <rect x="494" y="72" width="28" height="48"/>
  </g>
  <!-- Glowing arc -->
  <path d="M60 120 C 260 125, 420 90, 560 -10" fill="none" stroke="url(#arc)" stroke-width="5" filter="url(#glow)"/>
  <path d="M60 120 C 260 125, 420 90, 560 -10" fill="none" stroke="url(#arc)" stroke-width="1.5"/>
</svg>
