<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" preserveAspectRatio="xMaxYMax meet">
  <defs>
    <linearGradient id="city" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f8cff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8f8cff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ec25b4" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#ec25b4"/>
      <stop offset="0.75" stop-color="#7736ed"/>
      <stop offset="1" stop-color="#3865f5"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2.5"/></filter>
  </defs>
  <!-- Skyline -->
