<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Caseware Installer</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!--
      Loading screen, shown from the first paint until Angular renders App, which replaces
      everything inside <app-root>. Inline and self-contained (no Angular, Material or bundled
      fonts) so it appears at once. The navy matches the hero and the window's backgroundColor
      in tauri.conf.json, so start-up goes navy -> loading screen -> app with no white flash.
    -->
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #0a1640;
      }

      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background:
          radial-gradient(60% 55% at 78% 18%, rgb(240 48 93 / 28%), transparent 70%),
          radial-gradient(55% 60% at 12% 92%, rgb(106 23 208 / 38%), transparent 70%),
          linear-gradient(180deg, #0a1640, #120c4a);
        color: #fff;
        font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
      }

      .boot img {
        width: 260px;
        height: auto;
      }

      /* Coral bar sliding along a faint track, as the download progress bar does. */
      .boot-bar {
        position: relative;
        width: 220px;
        height: 4px;
        overflow: hidden;
        border-radius: 999px;
        background: rgb(255 255 255 / 16%);
      }

      .boot-bar::before {
        content: '';
        position: absolute;
        inset: 0 auto 0 0;
        width: 40%;
        border-radius: inherit;
        background: linear-gradient(90deg, #ff5a4f, #f0305d 55%, #c21c6b);
        animation: boot-slide 1.3s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }

      @keyframes boot-slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }

      .boot p {
        margin: 0;
        color: rgb(255 255 255 / 78%);
        font-size: 15px;
        letter-spacing: 0.01em;
      }

      /*
       * The same screen reused by the app while Next checks the download code (app.html, shown
       * only once the wait passes 200ms so a quick reply doesn't flash it). It fades in, and
       * fades out once the products screen is ready (Angular's animate.leave adds .boot-leave).
       * Transitions, not keyframes, so a fade-out that interrupts the fade-in starts from where
       * it is. The update blocker (z-index 1000) stays above it.
       */
      .boot-overlay {
        z-index: 900;
        transition: opacity 380ms cubic-bezier(0.4, 0, 0.2, 1);
      }

      @starting-style {
        .boot-overlay {
          opacity: 0;
        }
      }

      .boot-overlay.boot-leave {
        opacity: 0;
        transition: opacity 440ms cubic-bezier(0.4, 0, 0.6, 1);
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-bar::before {
          width: 100%;
          animation: boot-pulse 1.6s ease-in-out infinite alternate;
        }

        @keyframes boot-pulse {
          from {
            opacity: 0.35;
          }
          to {
            opacity: 1;
          }
        }
      }
    </style>
  </head>
  <body>
    <app-root>
      <div class="boot" role="status" aria-live="polite">
        <img src="logos/caseware-white.png" alt="Caseware" />
        <div class="boot-bar" aria-hidden="true"></div>
        <p>Loading Caseware Installer...</p>
      </div>
    </app-root>
  </body>
</html>
